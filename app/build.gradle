plugins {
    alias(libs.plugins.android.application)
}

/**
 * The ContentProvider that Stitch registers has a different class name in every
 * patched app, so this module cannot know its own entry point at development
 * time. The patcher supplies it: Stitch byte-replaces {{PAYWALL_PROVIDER_CLASS}}
 * across a copy of this project - gradle.properties included - before it runs
 * `gradlew assembleRelease`. See README.md.
 */
abstract class GeneratePaywallProvider extends DefaultTask {

    @Input
    abstract Property<String> getProviderClass()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        String name = providerClass.get().trim()
        if (!(name ==~ /[A-Za-z_][A-Za-z0-9_]*/)) {
            throw new GradleException(
                    "paywallProviderClass is '${name}', which is not a Java identifier.\n" +
                    "Stitch substitutes it from the PAYWALL_PROVIDER_CLASS artifact at patch time, " +
                    "so the patcher's main.py has to supply it:\n" +
                    "    extra_artifacts['PAYWALL_PROVIDER_CLASS'] = 'InitProviderPaywallMoovit'\n" +
                    "To build this module on its own, pass -PpaywallProviderClass=InitProviderPaywallDev.")
        }
        def packageDir = new File(outputDir.get().asFile, 'com/paywall')
        packageDir.mkdirs()
        new File(packageDir, "${name}.java").text = """\
package com.paywall;

/** Generated by :app:generatePaywallProvider. Do not edit. */
public final class ${name} extends PaywallProvider {
}
"""
    }
}

def generatePaywallProvider = tasks.register('generatePaywallProvider', GeneratePaywallProvider) {
    // .orElse('') so a missing property lands in the task's own error message
    // rather than Gradle's "No value has been specified".
    providerClass.set(providers.gradleProperty('paywallProviderClass').orElse(''))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(generatePaywallProvider) { it.outputDir }
    }
}

android {
    namespace 'com.paywall'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.paywall"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.doLast {
            def apkDir = "$buildDir/outputs/apk/release"
            def apkFile = fileTree(dir: apkDir, includes: ["*.apk"]).singleFile
            def destinationDir = "./"

            mkdir(destinationDir)
            copy {
                from apkFile
                into "$destinationDir"
            }
            def output_apk = file("$destinationDir/${apkFile.name}")
            output_apk.renameTo("${destinationDir}/smali_generator.apk")
            println "APK moved to $destinationDir"
        }
    }
}
